<script>
/* a person's own link (/p/<id>): open People and centre the map on them */
(function(){
  const m=location.pathname.match(/^\/p\/([a-z0-9][a-z0-9-]{0,119})\/?$/);if(!m)return;
  const id=m[1];let tries=0;
  (function go(){
    const a=document.querySelector('#angles .angle[data-a="social"]');
    if(a&&a.getAttribute('aria-pressed')!=='true')a.click();
    if(window.synapseFocus&&window.synapseFocus(id))return;
    if(++tries<80)setTimeout(go,250);
  })();
})();
</script>
