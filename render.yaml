# Render Blueprint for Treasury Synapse.
# New -> Blueprint -> this repo -> Apply. Render asks for ANTHROPIC_API_KEY at apply time (sync: false).
services:
  - type: web
    name: treasury-synapse
    runtime: node
    region: frankfurt
    plan: starter
    branch: main
    buildCommand: npm ci --omit=dev
    preDeployCommand: npm run migrate && npm run import -- --if-empty data/seed/dump.json
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: synapse-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CHAT_MODEL
        value: claude-haiku-5-5
      - key: CHAT_PER_VISITOR
        value: "20"
      - key: CHAT_DAILY_CAP
        value: "1500"
      - key: ADMIN_TOKEN
        generateValue: true
      - key: IP_SALT
        generateValue: true
      - key: PUBLIC_URL
        value: https://synapse.k-phi.com
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false

  # Daily digest of the review queue, 6:43 UTC
  - type: cron
    name: synapse-digest
    runtime: node
    region: frankfurt
    plan: starter
    branch: main
    schedule: "43 6 * * *"
    buildCommand: npm ci --omit=dev
    startCommand: node scripts/digest.js
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: synapse-db
          property: connectionString
      - key: PUBLIC_URL
        value: https://synapse.k-phi.com
      - key: OWNER_EMAIL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false

  # Crawler on the K-phi API key: deepens 2 cards (or approved links) per run, stops at CRAWL_DAILY_USD a day
  - type: cron
    name: synapse-crawler
    runtime: node
    region: frankfurt
    plan: starter
    branch: main
    schedule: "37 */2 * * *"
    buildCommand: npm ci --omit=dev
    startCommand: node scripts/crawl.js
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: synapse-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        fromService:
          type: web
          name: treasury-synapse
          envVarKey: ANTHROPIC_API_KEY
      - key: CRAWL_MODEL
        value: claude-sonnet-5-5
      - key: CRAWL_TARGETS
        value: "2"
      - key: CRAWL_DAILY_USD
        value: "4"
      - key: CRAWL_PRICE_IN
        value: "3"
      - key: CRAWL_PRICE_OUT
        value: "15"

databases:
  - name: synapse-db
    region: frankfurt
    plan: basic-256mb
    postgresMajorVersion: "16"
